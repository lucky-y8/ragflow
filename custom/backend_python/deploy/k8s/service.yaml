# 集群内访问入口：前端页面和 API 共用 Nginx 的 80 端口。
apiVersion: v1
kind: Service
metadata:
  name: ragflow
  labels:
    app.kubernetes.io/name: ragflow
spec:
  # ClusterIP 只提供集群内地址；外部域名、Ingress 和 TLS 由平台配置。
  type: ClusterIP
  # 必须与 Deployment 中 Pod 的标签一致。
  selector:
    app.kubernetes.io/name: ragflow
  ports:
    - name: http
      # Service 对集群内客户端提供的端口。
      port: 80
      # 转发到应用容器中名为 http 的端口，即 containerPort: 80。
      targetPort: http
